name: Go

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Formatting advisory
        run: |
          files=$(gofmt -l cmd/netkit/*.go)
          if [ -n "$files" ]; then
            echo 'Formatting suggestions (run make fmt locally):'
            echo "$files"
          fi
      - name: Compile
        run: go build -o /tmp/netkit ./cmd/netkit
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Release package dry-run (no Tag or publication)
        if: runner.os == 'Linux'
        run: |
          python3 scripts/package_release.py --version dev --output dist
          python3 scripts/check_release.py --version dev --dist dist
          ( cd dist && sha256sum -c checksums.txt )
          mkdir -p /tmp/netkit-release-check
          tar -xzf dist/netkit_dev_linux_amd64.tar.gz -C /tmp/netkit-release-check
          /tmp/netkit-release-check/netkit version --output=json > /tmp/netkit-release-version.json
          python3 -c 'import json,subprocess; v=json.load(open("/tmp/netkit-release-version.json")); assert v["version"]=="dev"; assert v["commit"]==subprocess.check_output(["git","rev-parse","--short=12","HEAD"],text=True).strip()'
      - name: Cross-platform compilation
        if: runner.os == 'Linux'
        run: |
          GOOS=windows GOARCH=amd64 go build -o /tmp/netkit-windows.exe ./cmd/netkit
          GOOS=darwin GOARCH=arm64 go build -o /tmp/netkit-darwin-arm64 ./cmd/netkit
          GOOS=linux GOARCH=arm64 go build -o /tmp/netkit-linux-arm64 ./cmd/netkit
      - name: CLI smoke test
        run: |
          /tmp/netkit --help
          /tmp/netkit version
          /tmp/netkit version --output=json > /tmp/netkit-version.json
          /tmp/netkit ip --help
          /tmp/netkit domain -h
          /tmp/netkit domain records -h
          /tmp/netkit tls -h
          /tmp/netkit http -h
          /tmp/netkit tcp -h
          /tmp/netkit tcp -all-ips --output json 127.0.0.1 1 > /tmp/tcp-all.json || test $? -eq 2
          /tmp/netkit dns query -h
          /tmp/netkit dns compare -h
          /tmp/netkit dns list --output json > /tmp/public-dns.json
          /tmp/netkit ip -cidr 192.168.31.158/24 > /tmp/cidr.txt
          /tmp/netkit ip 192.168.1.1 > /tmp/private.txt
          if /tmp/netkit invalid >/tmp/netkit-err.txt 2>&1; then exit 1; fi
