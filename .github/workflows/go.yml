name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Formatting
        run: |
          gofmt -w cmd/netkit/*.go
          git diff --exit-code -- cmd/netkit
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /tmp/netkit ./cmd/netkit
      - name: CLI smoke test
        run: |
          /tmp/netkit --help
          /tmp/netkit ip --help
          /tmp/netkit invalid >/tmp/netkit-err.txt 2>&1 && exit 1 || true
